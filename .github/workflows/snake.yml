name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Anulakshmpb

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2310B981&color_dots=%230B1410,%230D2B22,%23065F46,%23059B6F,%2310B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2334D399&color_dots=%230B1410,%230D2B22,%23065F46,%23059B6F,%2334D399

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
